<!DOCTYPE html>
<html>
<head>
  <title>Continental Hotel Reservation Form</title>
  <style>
    body {
      background: #dcdcdc;
    }
    h2 {
      text-align: center;
      color: red;
    }
    table {
      margin: auto;
      background: #c8e0f8;
      border: 2 px solid black;
      border-collapse: collapse;
    }
    th, td {
      border: 1 px solid black;
      padding: 5 px;
    }
  </style>
</head>
<body>
  <h2>Continental Hotel Reservation Form</h2>

  <form>
    <table>
      <tr>
        <th>Name</th>
        <td><input type="text" placeholder="Enter your name"></td>
      </tr>
      <tr>
        <th>eMail</th>
        <td><input type="email" value="info@continental.pk"></td>
      </tr>
      <tr>
        <th>Mobile No</th>
        <td><input type="text" placeholder="Enter your cell number"></td>
      </tr>
      <tr>
        <th>Arrival Time</th>
        <td><input type="text" placeholder="Enter your arrival time"></td>
      </tr>
      <tr>
        <th>Departure</th>
        <td>
          <input type="text">
          <input type="text">
        </td>
      </tr>
      <tr>
        <th>Room Type</th>
        <td>
          <input type="radio" name="room">Single
          <input type="radio" name="room">Double<br>
          <input type="radio" name="room">Presidential Suite
        </td>
      </tr>
      <tr>
        <th>Preferences</th>
        <td>
          <input type="checkbox">Non-Smoking<br>
          <input type="checkbox">Internet<br>
          <input type="checkbox">Firm Mattress
        </td>
      </tr>
      <tr>
        <th>Mode of Payment</th>
        <td>
          <input type="checkbox">Cash
          <input type="checkbox">Check<br>
          <input type="checkbox">Credit Card
          <select>
            <option>Select Card</option>
          </select>
        </td>
      </tr>
      <tr>
        <td colspan="2" style="text-align:center">
          <input type="submit" value="Send Data">
        </td>
      </tr>
    </table>
  </form>

</body>
</html>
